name: Deploy

on:
  push:
    branches:
      - main
      - dev
    # The daily open-calls routine commits only routines/** straight to main.
    # Those files are not part of the site, so they must not trigger a deploy.
    paths-ignore:
      - 'routines/**'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
        run: npm run build

      - name: Resolve remote path
        id: remote
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "path=/var/www/healthaiatlas/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/healthaiatlas-dev/" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend/dist/
          remote_path: ${{ steps.remote.outputs.path }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT }}

      # Checks the live server, not the repo: catches nginx config that was
      # never applied (e.g. the Ansible playbook not re-run after a template
      # change). A red run here means production is serving slowly.
      - name: Production smoke check
        if: github.ref_name == 'main'
        env:
          SITE_URL: ${{ vars.PROD_URL || 'https://healthaiatlas.com' }}
        run: |
          set -euo pipefail
          html=$(curl -fsS "$SITE_URL/")
          js=$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          test -n "$js" || { echo "::error::no entry script in $SITE_URL/"; exit 1; }
          enc=$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "$SITE_URL$js" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')
          if [ "$enc" != "gzip" ]; then
            echo "::error::$SITE_URL$js is served without gzip (Content-Encoding: '${enc:-none}'). Re-run the Ansible playbook."
            exit 1
          fi
          curl -fsS -o /dev/null "$SITE_URL/landing"
          echo "OK: $js gzipped, /landing serves the app"
