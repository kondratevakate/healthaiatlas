<!-- @dsCard group="Colors" viewport="700x150" name="Semantic (evidence-tier only)" subtitle="success/warning/info — reserved for confidence + evidence chips" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-sans)">
<div style="flex:1;background:hsl(var(--success));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">success · Official / High</div>
<div style="flex:1;background:hsl(var(--warning));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">warning · Anecdotal</div>
<div style="flex:1;background:hsl(var(--info));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">info · Observed</div>
<div style="flex:1;background:hsl(var(--destructive));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">destructive</div>
</div>
