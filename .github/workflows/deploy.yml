name: Deploy

on:
  push:
    branches:
      - main
      - dev
    # The daily open-calls routine commits only routines/** straight to main.
    # Those files are not part of the site, so they must not trigger a deploy.
    paths-ignore:
      - 'routines/**'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
        run: npm run build

      - name: Resolve remote path
        id: remote
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "path=/var/www/healthaiatlas/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/healthaiatlas-dev/" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend/dist/
          remote_path: ${{ steps.remote.outputs.path }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
