<!-- @dsCard group="Colors" viewport="700x150" name="Primary + Neutrals" subtitle="Monochrome scale — the only 'brand color' is black" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-sans)">
<div style="flex:1;background:hsl(var(--foreground));color:hsl(var(--background));display:flex;align-items:flex-end;padding:10px;font-size:12px">foreground</div>
<div style="flex:1;background:hsl(var(--gray-1));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">gray-1</div>
<div style="flex:1;background:hsl(var(--gray-2));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">gray-2</div>
<div style="flex:1;background:hsl(var(--gray-3));color:#fff;display:flex;align-items:flex-end;padding:10px;font-size:12px">gray-3</div>
<div style="flex:1;background:hsl(var(--gray-4));color:#000;display:flex;align-items:flex-end;padding:10px;font-size:12px">gray-4</div>
<div style="flex:1;background:hsl(var(--gray-5));color:#000;display:flex;align-items:flex-end;padding:10px;font-size:12px">gray-5</div>
<div style="flex:1;background:hsl(var(--secondary));color:#000;display:flex;align-items:flex-end;padding:10px;font-size:12px;border-left:1px solid #eee">secondary</div>
</div>
