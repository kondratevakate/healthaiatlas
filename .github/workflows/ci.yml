name: CI

# Runs build + tests on PRs so a missing-file regression (see frontend/src/data/__tests__/hubs.integrity.test.ts)
# is caught before merge, not after the post-merge deploy fires.

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Landing JS size budget
        run: npm run check:bundle

      # Real-browser check of what a phone sees while the site opens: throttled
      # network, budgets for first paint and landing content, no third-party
      # fonts. See tests/first-load.spec.ts.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (first load, layout grid)
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx --yes wait-on@8 -t 30000 http://127.0.0.1:4173
          BASE_URL=http://127.0.0.1:4173 npx playwright test tests/first-load.spec.ts tests/layout-grid.spec.ts
