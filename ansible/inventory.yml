---
all:
  hosts:
    healthaiatlas:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER') | default('ubuntu', true) }}"
      ansible_port: "{{ lookup('env', 'DEPLOY_PORT') | default(22, true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'DEPLOY_SSH_KEY_PATH') }}"
      ansible_python_interpreter: /usr/bin/python3
