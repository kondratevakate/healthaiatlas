<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <title>HealthAI Atlas — Global Healthcare AI Navigator</title>
    <meta name="description" content="Research-driven navigator for the global healthcare AI ecosystem. A directory, system map, talent hub, and open-calls feed for founders, businesses, students and researchers, and job seekers." />

    <!-- Open Graph — PNG required because LinkedIn/X/Slack do not render SVG OG images.
         Source SVG kept at /og-image.svg; regenerate via `node scripts/generate-og-image.mjs`. -->
    <meta property="og:title" content="HealthAI Atlas — Global Healthcare AI Navigator" />
    <meta property="og:description" content="Research-driven navigator for the global healthcare AI ecosystem — directory, system map, talent hub, open calls." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HealthAI Atlas — Global Healthcare AI Navigator" />
    <meta name="twitter:description" content="Research-driven navigator for the global healthcare AI ecosystem — directory, system map, talent hub, open calls." />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      Google Analytics with Consent Mode v2.
      All storage is denied by default; the React CookieBanner calls
      window.gtag('consent','update', ...) once the user accepts. Until then,
      gtag.js loads but cannot read or write cookies, satisfying ePrivacy Art.
      5(3) and GDPR Art. 7 (no tracking before consent).
    -->
    <script>
      (function () {
        var gaId = "%VITE_GA_ID%";
        if (!gaId || gaId.indexOf("VITE_GA_ID") !== -1) return;
        window.dataLayer = window.dataLayer || [];
        function gtag(){ window.dataLayer.push(arguments); }
        window.gtag = gtag;

        // Consent Mode v2 — DENY everything until the banner records a choice.
        // Read prior choice synchronously so accepted users don't see a flicker.
        var prior = null;
        try { prior = localStorage.getItem("cookie-consent"); } catch (e) {}
        var granted = prior === "granted";
        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: granted ? "granted" : "denied",
          wait_for_update: 500
        });

        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
        document.head.appendChild(s);
        gtag("js", new Date());
        gtag("config", gaId, { anonymize_ip: true });
      })();
    </script>

    <!--
      Cloudflare Web Analytics: cookieless, no consent needed, so it counts
      every visit including people who decline the GA cookie banner. Tracks
      SPA route changes on its own. Token comes from the Cloudflare dashboard
      (Web Analytics -> Add site) via the VITE_CF_BEACON_TOKEN build secret;
      unset means the script is not loaded.
    -->
    <script>
      (function () {
        var token = "%VITE_CF_BEACON_TOKEN%";
        if (!token || token.indexOf("VITE_CF_BEACON_TOKEN") !== -1) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.head.appendChild(s);
      })();
    </script>

    <!-- Boot loader styles live in <head> so the loader paints on the first frame.
         .boot-spinner is also used by RouteFallback for lazily loaded pages. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }
      #boot-loader.boot-loader--done { opacity: 0; pointer-events: none; }
      .boot-wordmark {
        font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #000000;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #e6e6e6;
        border-top-color: #000000;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      /* Fast loads finish before this delay, so no spinner flashes by. */
      .boot-spinner--delayed {
        opacity: 0;
        animation: boot-spin 0.8s linear infinite, boot-appear 200ms ease-out 400ms forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-appear { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader { transition: none; }
        .boot-spinner, .boot-spinner--delayed { animation-duration: 2s, 200ms; }
      }
    </style>
  </head>

  <body>
    <!-- App boot loader: an overlay outside #root, painted from inline CSS before
         any JS arrives. main.tsx fades it out once React has rendered, so the
         page does not jump from loader to content in one frame.
         Minimal/government style: black ring on white, no category color. -->
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-wordmark">HealthAI Atlas</div>
      <div class="boot-spinner boot-spinner--delayed"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
