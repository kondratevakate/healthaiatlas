<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel">
const { Button, Tag } = window.HealthAIAtlasDesignSystem_f13808;
const personas = [
  { id: 'patient', icon: '●', title: 'Patients', desc: 'Understand AI tools used in your care and how to evaluate them.' },
  { id: 'doctor', icon: '⚕', title: 'Clinicians', desc: 'AI tools in deployment and how to evaluate them critically.' },
  { id: 'business', icon: '■', title: 'Businesses', desc: 'Evaluate vendors and partnership candidates.' },
  { id: 'startup', icon: '▲', title: 'Founders', desc: 'Navigate the ecosystem, find collaborators and benchmarks.' },
  { id: 'leader', icon: '◆', title: 'Job seekers', desc: 'See who is hiring in healthcare AI in the regions we cover.' },
];

function PersonaCard({ p }) {
  const [hover, setHover] = React.useState(false);
  return (
    <a onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{display:'flex',flexDirection:'column',padding:24,border:'1px solid hsl(var(--border))',borderColor:hover?'hsl(var(--foreground) / 0.5)':'hsl(var(--border))',textDecoration:'none',color:'inherit',minHeight:190,transition:'border-color .3s'}}>
      <div style={{fontSize:22,marginBottom:16,color:hover?'hsl(var(--foreground))':'hsl(var(--muted-foreground))'}}>{p.icon}</div>
      <h3 style={{fontWeight:600,marginBottom:8,fontSize:15}}>{p.title}</h3>
      <p style={{fontSize:13,color:'hsl(var(--muted-foreground))',flex:1,lineHeight:1.5}}>{p.desc}</p>
      <div style={{fontSize:13,fontWeight:500,color:hover?'hsl(var(--foreground))':'hsl(var(--muted-foreground))',display:'flex',gap:hover?8:4,transition:'gap .2s'}}>Explore &rarr;</div>
    </a>
  );
}

function Header() {
  const links = ['Open Calls', 'Jobs', 'Domains', 'Founder Toolkit', 'About'];
  return (
    <header style={{position:'sticky',top:0,zIndex:50,background:'hsl(var(--background))',borderBottom:'1px solid hsl(var(--border))'}}>
      <div className="container" style={{display:'flex',height:64,alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontWeight:700,fontSize:18,letterSpacing:'-0.02em'}}>HealthAI Atlas</div>
        <nav style={{display:'flex',gap:28}}>
          {links.map(l => <span key={l} style={{fontSize:14,fontWeight:500,color:'hsl(var(--muted-foreground))',cursor:'pointer'}}>{l}</span>)}
        </nav>
        <div style={{display:'flex',gap:4}}>
          <Button variant="ghost" size="icon">&#128269;</Button>
          <Button variant="ghost" size="icon">&#127760;</Button>
        </div>
      </div>
    </header>
  );
}

function Hero() {
  return (
    <section className="container" style={{padding:'96px 0'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:60,alignItems:'start'}}>
        <div>
          <h1 className="heading-display-xl section-marker" style={{fontSize:88}}>AI Health<br/>Directory</h1>
        </div>
        <div style={{paddingTop:32}}>
          <p className="text-body" style={{color:'hsl(var(--muted-foreground))',maxWidth:480,marginBottom:32}}>
            Who's building healthcare AI globally — and what's actually deployed. With evidence links, not marketing claims.
          </p>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            <Button size="lg">Explore Directory &rarr;</Button>
            <Button variant="outline" size="lg">Discovery &rarr;</Button>
          </div>
        </div>
      </div>
    </section>
  );
}

function Stats() {
  const stats = [{v:214,l:'Players tracked'},{v:12,l:'Countries'},{v:340,l:'Timeline events'}];
  return (
    <section className="container" style={{padding:'48px 0',borderTop:'1px solid hsl(var(--border))',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:32}}>
      {stats.map(s => (
        <div key={s.l}>
          <div style={{fontSize:56,fontWeight:700,letterSpacing:'-0.02em'}}>{s.v}</div>
          <div style={{fontSize:13,textTransform:'uppercase',letterSpacing:'0.08em',color:'hsl(var(--muted-foreground))',fontWeight:500}}>{s.l}</div>
        </div>
      ))}
    </section>
  );
}

function PersonaSection() {
  return (
    <section className="container" style={{padding:'64px 0',borderTop:'1px solid hsl(var(--border))'}}>
      <h2 className="heading-serif section-marker" style={{marginBottom:16,fontSize:34}}>Find your path</h2>
      <p className="text-body" style={{color:'hsl(var(--muted-foreground))',maxWidth:600,marginBottom:48}}>Five ways in, one evidence standard.</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:16}}>
        {personas.map(p => <PersonaCard key={p.id} p={p} />)}
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer style={{background:'hsl(var(--footer))',color:'hsl(var(--footer-foreground))',padding:'64px 0'}}>
      <div className="container">
        <div style={{fontSize:48,fontWeight:700,letterSpacing:'-0.02em',lineHeight:1,marginBottom:16}}>HealthAI<br/>Atlas</div>
        <div style={{opacity:.6,fontSize:13}}>&copy; 2026 HealthAI Atlas. Independent research project.</div>
      </div>
    </footer>
  );
}

function App() {
  return (<div><Header/><Hero/><Stats/><PersonaSection/><Footer/></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
